<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #4facfe, #00f2fe);
            background-size:400% 400%;
            animation: gradientMove 10s ease infinite;
        }

        @keyframes gradientMove{
            0%{
                background-position:0% 50%;
            }

            50%{
                background-position:100% 50%;
            }

            100%{
                background-position:0% 50%;
            }
        }

        .login-box{
            width:350px;
            padding:40px;
            background:white;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#1e3c72;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
            border:none;
            border-radius:10px;
            background:#f1f1f1;
            transition:0.3s;
        }

        input:focus{
            outline:none;
            background:#e0ecff;
            transform:scale(1.02);
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#1e3c72;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#2a5298;
            transform:scale(1.03);
        }

        .register{
            margin-top:20px;
            text-align:center;
        }

        .register a{
            text-decoration:none;
            color:#1e3c72;
            font-weight:bold;
        }

        .register a:hover{
            text-decoration:underline;
        }

        .error{
            color:red;
            text-align:center;
            margin-top:10px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>Login</h2>

    <form action="/login" method="post">

        <input type="email" name="email" placeholder="Enter your email"/>

        <input type="password" name="password" placeholder="Enter your password"/>

        <button type="submit">Login</button>

    </form>

    <p class="error" th:text="${error}"></p>

    <div class="register">
        Don't have an account?
        <a href="/register">Register</a>
    </div>

</div>

</body>
</html>
