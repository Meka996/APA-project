<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Trainees</h1>
        <div>
            <a class="btn btn-outline-light" href="/trainer/dashboard">Dashboard</a>
            <a class="btn btn-outline-light" href="/logout">Logout</a>
        </div>
    </div>

    <div class="card bg-secondary-subtle text-dark">
        <div class="card-body">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Goal</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(trainees)}">
                    <td colspan="4">No trainees registered yet.</td>
                </tr>
                <tr th:each="trainee : ${trainees}">
                    <td>
                        <span th:text="${trainee.firstName}">First</span>
                        <span th:text="${trainee.lastName}">Last</span>
                    </td>
                    <td th:text="${trainee.email}">email@example.com</td>
                    <td th:text="${trainee.fitnessGoal}">Goal</td>
                    <td>
                        <a class="btn btn-primary btn-sm"
                           th:href="@{/trainer/trainees/{traineeId}/workouts(traineeId=${trainee.id})}">
                            View Workouts
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
