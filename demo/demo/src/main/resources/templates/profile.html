<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            min-height:100vh;
        }

        /* NAVBAR */

        .navbar{
            background:rgba(15, 23, 42, 0.9);
            backdrop-filter:blur(10px);
            padding:18px 40px;
            border-bottom:1px solid rgba(255,255,255,0.08);
        }

        .navbar-brand{
            font-size:1.6rem;
            font-weight:700;
            color:#38bdf8 !important;
        }

        .nav-link{
            color:#cbd5e1 !important;
            margin-left:20px;
            transition:0.3s;
        }

        .nav-link:hover{
            color:#38bdf8 !important;
        }

        /* PROFILE SECTION */

        .profile-section{
            padding:50px 0;
        }

        .profile-card{
            background:linear-gradient(145deg, #1e293b, #111827);
            border-radius:25px;
            padding:40px;
            box-shadow:0 10px 30px rgba(0,0,0,0.35);
            border:1px solid rgba(255,255,255,0.06);
        }

        .profile-header{
            display:flex;
            align-items:center;
            gap:20px;
            margin-bottom:35px;
        }

        .profile-avatar{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#38bdf8;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:2rem;
            font-weight:700;
            color:white;
        }

        .profile-name{
            font-size:2rem;
            font-weight:700;
        }

        .profile-role{
            color:#94a3b8;
            margin-top:5px;
        }

        /* INFO CARDS */

        .info-card{
            background:#0f172a;
            border-radius:18px;
            padding:25px;
            margin-bottom:20px;
            border:1px solid rgba(255,255,255,0.05);
        }

        .info-title{
            color:#38bdf8;
            font-weight:600;
            margin-bottom:20px;
            font-size:1.1rem;
        }

        .info-item{
            margin-bottom:15px;
        }

        .info-label{
            color:#94a3b8;
            font-size:0.9rem;
        }

        .info-value{
            font-size:1.05rem;
            font-weight:500;
        }

        /* FORM */

        .form-control{
            background:#1e293b;
            border:none;
            color:white;
            padding:14px;
            border-radius:12px;
        }

        .form-control:focus{
            background:#1e293b;
            color:white;
            box-shadow:none;
            border:1px solid #38bdf8;
        }

        .form-label{
            color:#cbd5e1;
            margin-bottom:8px;
        }

        /* BUTTONS */

        .custom-btn{
            background:#38bdf8;
            border:none;
            color:white;
            padding:14px 24px;
            border-radius:14px;
            font-weight:600;
            transition:0.3s;
        }

        .custom-btn:hover{
            background:#0ea5e9;
            transform:translateY(-2px);
        }

        .secondary-btn{
            background:#1e293b;
            color:white;
            border:none;
            padding:14px 24px;
            border-radius:14px;
            transition:0.3s;
            text-decoration:none;
        }

        .secondary-btn:hover{
            background:#334155;
        }

        /* FOOTER */

        footer{
            margin-top:50px;
            padding:25px;
            text-align:center;
            color:#94a3b8;
            border-top:1px solid rgba(255,255,255,0.06);
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            FitTrack
        </a>

        <div>

            <a class="nav-link d-inline" href="/dashboard">
                Dashboard
            </a>

            <a class="nav-link d-inline" href="/workout-track">
                Workouts
            </a>

            <a class="nav-link d-inline" href="/logout">
                Logout
            </a>

        </div>

    </div>

</nav>

<!-- PROFILE -->

<div class="container profile-section">

    <div class="profile-card">

        <!-- HEADER -->

        <div class="profile-header">

            <div class="profile-avatar">
                <span th:text="${user.firstName != null and !#strings.isEmpty(user.firstName) ? user.firstName.substring(0,1) : 'U'}">
                    A
                </span>
            </div>

            <div>

                <div class="profile-name">
                    <span th:text="${user.firstName}"></span>
                    <span th:text="${user.lastName}"></span>
                </div>

                <div class="profile-role">
                    <span th:text="${user.trainer} ? 'Trainer' : 'Trainee'"></span>
                </div>

            </div>

        </div>

        <div class="row">

            <!-- LEFT SIDE -->

            <div class="col-lg-5">

                <div class="info-card">

                    <div class="info-title">
                        Personal Information
                    </div>

                    <div class="info-item">
                        <div class="info-label">Email</div>
                        <div class="info-value"
                             th:text="${user.email}">
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">Weight</div>
                        <div class="info-value"
                             th:text="${user.weight + ' kg'}">
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">Height</div>
                        <div class="info-value"
                             th:text="${user.height + ' cm'}">
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">Fitness Goal</div>
                        <div class="info-value"
                             th:text="${user.fitnessGoal}">
                        </div>
                    </div>

                </div>

                <a href="/workout-track"
                   class="secondary-btn d-inline-block mt-2">

                    <i class="bi bi-clock-history"></i>
                    Workout Track

                </a>

            </div>

            <!-- RIGHT SIDE -->

            <div class="col-lg-7">

                <div class="info-card">

                    <div class="info-title">
                        Edit Profile
                    </div>

                    <form action="/profile"
                          method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                First Name
                            </label>

                            <input type="text"
                                   name="firstName"
                                   class="form-control"
                                   th:value="${user.firstName}">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Last Name
                            </label>

                            <input type="text"
                                   name="lastName"
                                   class="form-control"
                                   th:value="${user.lastName}">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Weight
                            </label>

                            <input type="number"
                                   name="weight"
                                   class="form-control"
                                   th:value="${user.weight}">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Height
                            </label>

                            <input type="number"
                                   name="height"
                                   class="form-control"
                                   th:value="${user.height}">

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Fitness Goal
                            </label>

                            <input type="text"
                                   name="fitnessGoal"
                                   class="form-control"
                                   th:value="${user.fitnessGoal}">

                        </div>

                        <button type="submit"
                                class="custom-btn">

                            <i class="bi bi-check-lg"></i>
                            Update Profile

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- FOOTER -->

<footer>
    FitTrack © 2026 | Fitness Tracking System
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
