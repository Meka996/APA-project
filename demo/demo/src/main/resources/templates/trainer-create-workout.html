<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Workout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-dark text-white">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Create Workout</h1>
            <p class="text-secondary mb-0">
                Assign a workout to
                <span th:text="${trainee.firstName}">First</span>
                <span th:text="${trainee.lastName}">Last</span>
            </p>
        </div>
        <div>
            <a class="btn btn-outline-light" href="/trainer/trainees?mode=create">Back</a>
            <a class="btn btn-outline-light" href="/logout">Logout</a>
        </div>
    </div>

    <div class="card bg-secondary-subtle text-dark">
        <div class="card-body">
            <form th:action="@{/trainer/trainees/{traineeId}/workouts/create(traineeId=${trainee.id})}"
                  method="post"
                  class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Workout Title</label>
                    <input class="form-control" type="text" name="title" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Duration</label>
                    <input class="form-control" type="number" name="duration" min="1" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Calories Target</label>
                    <input class="form-control" type="number" name="caloriesTarget" min="0">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Assigned Date</label>
                    <input class="form-control" type="date" name="assignedDate" required>
                </div>

                <div class="col-12">
                    <label class="form-label">Instructions</label>
                    <textarea class="form-control" name="instructions" rows="5"></textarea>
                </div>

                <div class="col-12">
                    <button class="btn btn-success" type="submit">
                        <i class="bi bi-check-lg"></i>
                        Save Workout
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
