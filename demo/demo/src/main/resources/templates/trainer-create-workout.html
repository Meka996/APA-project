<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Workout</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            min-height:100vh;
        }

        /* NAVBAR */

        .navbar{
            background:rgba(15,23,42,0.9);
            backdrop-filter:blur(10px);
            padding:18px 40px;
            border-bottom:1px solid rgba(255,255,255,0.08);
        }

        .navbar-brand{
            color:#38bdf8 !important;
            font-weight:700;
            font-size:1.6rem;
        }

        .outline-btn{
            border:1px solid rgba(255,255,255,0.15);
            color:white;
            padding:10px 18px;
            border-radius:12px;
            text-decoration:none;
            transition:0.3s;
            margin-left:10px;
            display:inline-block;
        }

        .outline-btn:hover{
            background:#1e293b;
        }

        /* HERO */

        .hero-section{
            padding:60px 0 30px;
        }

        .hero-title{
            font-size:3rem;
            font-weight:700;
            margin-bottom:10px;
        }

        .hero-subtitle{
            color:#94a3b8;
        }

        /* PROFILE CARD */

        .trainee-card{
            background:linear-gradient(145deg,#1e293b,#111827);
            border-radius:25px;
            padding:25px;
            margin-bottom:35px;
            box-shadow:0 10px 30px rgba(0,0,0,0.35);
            border:1px solid rgba(255,255,255,0.05);
        }

        .trainee-info{
            display:flex;
            align-items:center;
            gap:20px;
        }

        .avatar{
            width:80px;
            height:80px;
            border-radius:50%;
            background:#38bdf8;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:2rem;
            font-weight:700;
            color:white;
        }

        .trainee-name{
            font-size:1.7rem;
            font-weight:700;
        }

        .trainee-subtitle{
            color:#94a3b8;
            margin-top:5px;
        }

        /* FORM CARD */

        .form-card{
            background:linear-gradient(145deg,#1e293b,#111827);
            border-radius:25px;
            padding:35px;
            box-shadow:0 10px 30px rgba(0,0,0,0.35);
            border:1px solid rgba(255,255,255,0.05);
        }

        .section-title{
            font-size:1.5rem;
            font-weight:600;
            margin-bottom:30px;
        }

        /* FORM */

        .form-label{
            color:#cbd5e1;
            margin-bottom:10px;
            font-weight:500;
        }

        .form-control{
            background:#0f172a;
            border:1px solid rgba(255,255,255,0.08);
            color:white;
            border-radius:14px;
            padding:14px;
        }

        .form-control:focus{
            background:#0f172a;
            color:white;
            border-color:#38bdf8;
            box-shadow:none;
        }

        textarea.form-control{
            resize:none;
        }

        /* BUTTON */

        .save-btn{
            background:#22c55e;
            border:none;
            color:white;
            padding:14px 22px;
            border-radius:14px;
            font-weight:600;
            transition:0.3s;
        }

        .save-btn:hover{
            background:#16a34a;
            transform:translateY(-2px);
        }

        /* FOOTER */

        footer{
            margin-top:60px;
            padding:25px;
            text-align:center;
            color:#94a3b8;
            border-top:1px solid rgba(255,255,255,0.06);
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            FitTrack
        </a>

        <div>

            <a class="outline-btn"
               href="/trainer/trainees?mode=create">

                Back

            </a>

            <a class="outline-btn"
               href="/logout">

                Logout

            </a>

        </div>

    </div>

</nav>

<!-- HERO -->

<div class="container hero-section">

    <h1 class="hero-title">
        Create Workout
    </h1>

    <p class="hero-subtitle">
        Assign personalized workouts and track trainee progress.
    </p>

</div>

<!-- TRAINEE CARD -->

<div class="container">

    <div class="trainee-card">

        <div class="trainee-info">

            <div class="avatar">

                <span th:text="${trainee.firstName.substring(0,1)}">
                    A
                </span>

            </div>

            <div>

                <div class="trainee-name">

                    <span th:text="${trainee.firstName}">
                        First
                    </span>

                    <span th:text="${trainee.lastName}">
                        Last
                    </span>

                </div>

                <div class="trainee-subtitle">
                    Workout Assignment Target
                </div>

            </div>

        </div>

    </div>

</div>

<!-- FORM -->

<div class="container">

    <div class="form-card">

        <h3 class="section-title">
            Workout Information
        </h3>

        <form th:action="@{/trainer/trainees/{traineeId}/workouts/create(traineeId=${trainee.id})}"
              method="post"
              class="row g-4">

            <!-- TITLE -->

            <div class="col-md-6">

                <label class="form-label">
                    Workout Title
                </label>

                <input class="form-control"
                       type="text"
                       name="title"
                       placeholder="Push Day"
                       required>

            </div>

            <!-- DURATION -->

            <div class="col-md-3">

                <label class="form-label">
                    Duration (mins)
                </label>

                <input class="form-control"
                       type="number"
                       name="duration"
                       min="1"
                       placeholder="45"
                       required>

            </div>

            <!-- CALORIES -->

            <div class="col-md-3">

                <label class="form-label">
                    Calories Target
                </label>

                <input class="form-control"
                       type="number"
                       name="caloriesTarget"
                       min="0"
                       placeholder="350">

            </div>

            <!-- DATE -->

            <div class="col-md-4">

                <label class="form-label">
                    Assigned Date
                </label>

                <input class="form-control"
                       type="date"
                       name="assignedDate"
                       required>

            </div>

            <!-- INSTRUCTIONS -->

            <div class="col-12">

                <label class="form-label">
                    Instructions
                </label>

                <textarea class="form-control"
                          name="instructions"
                          rows="6"
                          placeholder="Add workout notes, exercises, or trainer instructions..."></textarea>

            </div>

            <!-- BUTTON -->

            <div class="col-12">

                <button class="save-btn"
                        type="submit">

                    <i class="bi bi-check-lg"></i>
                    Save Workout

                </button>

            </div>

        </form>

    </div>

</div>

<footer>
    FitTrack © 2026 | Workout Assignment System
</footer>

</body>

</html>
