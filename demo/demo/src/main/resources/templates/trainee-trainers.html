<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Trainer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-dark text-white">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Choose a Trainer</h1>
            <p class="text-secondary mb-0">Browse available trainer profiles.</p>
        </div>
        <div>
            <a class="btn btn-outline-light" href="/trainee/dashboard">Dashboard</a>
            <a class="btn btn-outline-light" href="/logout">Logout</a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12" th:if="${param.success}">
            <div class="alert alert-success">
                Trainer selected successfully.
            </div>
        </div>

        <div class="col-12" th:if="${param.error}">
            <div class="alert alert-danger">
                Could not select trainer. Please try again.
            </div>
        </div>

        <div class="col-12" th:if="${#lists.isEmpty(trainers)}">
            <div class="alert alert-secondary">
                No trainers are available yet.
            </div>
        </div>

        <div class="col-md-4" th:each="trainer : ${trainers}">
            <div class="card h-100 bg-secondary-subtle text-dark">
                <div class="card-body">
                    <h3 class="h5">
                        <span th:text="${trainer.firstname}">First</span>
                        <span th:text="${trainer.lastname}">Last</span>
                    </h3>
                    <p class="mb-2">
                        <strong>Email:</strong>
                        <span th:text="${trainer.email}">trainer@example.com</span>
                    </p>
                    <p class="mb-2">
                        <strong>Specialization:</strong>
                        <span th:text="${trainer.specialization != null ? trainer.specialization : 'General fitness'}">General fitness</span>
                    </p>
                    <p class="text-muted" th:text="${trainer.bio != null ? trainer.bio : 'No bio added yet.'}">
                        No bio added yet.
                    </p>
                    <form th:action="@{/trainee/trainers/{trainerId}/choose(trainerId=${trainer.id})}" method="post">
                        <button class="btn btn-success"
                                type="submit"
                                th:disabled="${selectedTrainer != null && selectedTrainer.id == trainer.user.id}"
                                th:text="${selectedTrainer != null && selectedTrainer.id == trainer.user.id ? 'Selected' : 'Choose Trainer'}">
                            Choose Trainer
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
