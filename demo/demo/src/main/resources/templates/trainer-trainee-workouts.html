<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainee Workout History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Workout History</h1>
            <p class="text-secondary mb-0">
                <span th:text="${trainee.firstName}">First</span>
                <span th:text="${trainee.lastName}">Last</span>
            </p>
        </div>
        <div>
            <a class="btn btn-outline-light" href="/trainer/trainees">Back to Trainees</a>
            <a class="btn btn-outline-light" href="/logout">Logout</a>
        </div>
    </div>

    <div class="card bg-secondary-subtle text-dark">
        <div class="card-body">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Workout</th>
                    <th>Duration</th>
                    <th>Calories</th>
                    <th>Notes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(sessions)}">
                    <td colspan="5">No workout sessions found.</td>
                </tr>
                <tr th:each="workoutSession : ${sessions}">
                    <td th:text="${workoutSession.completedAt}">2026-05-09</td>
                    <td th:text="${workoutSession.workoutTitle}">Push Day</td>
                    <td>
                        <span th:text="${workoutSession.duration}">45</span> mins
                    </td>
                    <td th:text="${workoutSession.caloriesBurned}">420</td>
                    <td th:text="${workoutSession.notes}">Notes</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
