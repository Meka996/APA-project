<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trainee Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    <h1>Welcome Back!</h1>

    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card p-3">
                <h4>Current BMI</h4>
                <p th:text="${bmi}"></p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3">
                <h4>Calories Goal</h4>
                <p th:text="${calories}"></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
