<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Workout Plans</title>
</head>
<body>

<div class="container mt-4">
    <h2>Workout Plans</h2>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Title</th>
            <th>Difficulty</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="plan : ${plans}">
            <td th:text="${plan.title}"></td>
            <td th:text="${plan.difficulty}"></td>
            <td>
                <a th:href="@{/workouts/details/{id}(id=${plan.id})}" class="btn btn-primary">View</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
